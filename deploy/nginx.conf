# ============================================================================
# Nginx 反向代理配置
# ============================================================================
# 职责：
#   1. HTTPS 卸载（证书在这一层，容器里跑的还是普通 HTTP）
#   2. 把 80 端口的请求跳转到 443（因为会话 cookie 带 Secure，必须走 HTTPS）
#   3. 给应用传真实的客户端 IP 和协议
#
# 需要替换：你的域名（两处）
# ============================================================================

# ---------------------------------------------------------------------------
# HTTP：全部跳转到 HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;          # ← 改成你的域名

    # Let's Encrypt 续期用（用 certbot 时保留）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;          # ← 改成你的域名

    # 证书（用 certbot 签发后，把文件放到 ./certs/ 目录）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS：告诉浏览器以后只用 HTTPS 访问（确认 HTTPS 稳定后再打开）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 请求体大小限制：防止有人 POST 一个巨大字符串去打 LLM。
    # 聊天消息本来就该很短，1MB 足够宽松。
    client_max_body_size 1m;

    # 访问日志
    access_log /var/log/nginx/kings-hand.access.log;
    error_log  /var/log/nginx/kings-hand.error.log warn;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;

        # 传给应用的真实信息（应用靠这些记录正确的客户端 IP）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 对话会调用 LLM，可能几十秒。超时给足，否则会被 Nginx 掐断。
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # 关掉缓冲，将来做流式输出（SSE）时不用再改
        proxy_buffering off;
    }

    # 静态资源：交给应用处理即可（它挂载了 /static）。
    # ⚠️ 这里刻意不开长缓存：项目没有构建步骤、URL 上也没有 hash，
    #    改完 css/js 用户刷新就该看到新的。no-cache = 允许缓存但每次都回源验证，
    #    有 304 兜底，开销可以忽略。
    # ⚠️ location 里一旦写了 add_header，就会**重置**从 server 继承的 add_header，
    #    所以安全头必须在这里重复一遍（nginx 的继承规则）。
    location /static/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
