name: smoke

# 每次推到 main 或开 PR 时，自动跑一遍回归测试。
# 这些脚本都是离线的：自己建临时库、桩掉外部 API，不需要任何 Key。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行回归测试
        run: |
          failed=0
          for f in tools/smoke_*.py; do
            echo "=========================================="
            echo "== $f"
            echo "=========================================="
            python "$f" || failed=1
          done
          exit $failed
