<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The King's Hand</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- 主题层：只负责外观（黑白 / 磨砂玻璃 / 彩色琉璃），必须放在 style.css 之后 -->
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>

  <!-- ==================== 登录 / 注册 ==================== -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1>The King&rsquo;s Hand</h1>
      <p class="login-sub">你的私人日历助手</p>

      <div class="login-tabs">
        <button id="login-tab-login" class="login-tab active">登录</button>
        <button id="login-tab-register" class="login-tab">注册</button>
      </div>

      <form id="login-form" autocomplete="on">
        <label>邮箱
          <input id="login-email" type="email" autocomplete="username" placeholder="you@example.com">
        </label>
        <label>密码
          <input id="login-password" type="password" autocomplete="current-password" placeholder="至少 6 位">
        </label>
        <div id="login-error" class="login-error hidden"></div>
        <button id="login-submit" type="submit" class="primary">登录</button>
      </form>

      <button id="login-resend" class="ghost hidden">没收到确认邮件？重新发送</button>
      <p id="login-hint" class="login-hint">用你的邮箱和密码登录。</p>
    </div>
  </div>

  <!-- ==================== 主界面 ==================== -->
  <div id="app-root" class="app-container hidden">
    <div class="left-panel">
      <div class="chat-container">
        <div class="chat-header">
          <h2>The King&rsquo;s Hand</h2>
          <div class="chat-header-actions">
            <label class="toggle">
              <input type="checkbox" id="show-steps" checked>
              思考过程
            </label>
            <button id="memory-btn" title="查看和修改 AI 记住的关于你的信息">我的记忆</button>
            <button id="export-ics-btn">下载 .ics</button>
            <button id="export-email-btn">发送到邮箱</button>
            <button id="reset-btn" title="只清空对话上下文，不动日历和记忆">清空对话</button>
          </div>
        </div>
        <div class="account-bar">
          <span id="user-chip" class="user-chip" title="点击配置 API Key">…</span>
          <span class="account-actions">
            <button id="settings-btn" class="ghost">API Key setting</button>
            <button id="logout-btn" class="ghost">Log out</button>
          </span>
        </div>
        <div id="chat-history" class="chat-history"></div>
        <div class="chat-input-area">
          <input id="chat-input" type="text" placeholder="输入任务，例如：明天下午三点开会" autocomplete="off">
          <button id="send-btn">发送</button>
        </div>
      </div>

      <div class="task-container">
        <div class="task-tabs">
          <button class="tab-btn active" data-tab="confirmed">To be confirmed</button>
          <button class="tab-btn" data-tab="planned">To be planned</button>
          <button id="confirm-all-btn" class="btn-confirm">All confirmed</button>
        </div>
        <div id="task-list" class="task-list"></div>
      </div>
    </div>

    <div class="right-panel">
      <div id="main-calendar" class="main-calendar">
        <div class="calendar-header">
          <div class="calendar-title">Week View</div>
          <div class="calendar-days"></div>
        </div>
        <div class="calendar-body" id="calendar-body"></div>
      </div>

      <div id="bottom-handle" class="bottom-handle">
        <span>⌃ Next Week</span>
      </div>

      <div id="next-week-overlay" class="next-week-overlay hidden">
        <div class="overlay-header">
          <span id="overlay-title">Next Week</span>
          <button id="overlay-close">收起</button>
        </div>
        <div class="overlay-days-header" id="overlay-days-header"></div>
        <div class="overlay-body" id="overlay-body"></div>
      </div>
    </div>
  </div>

  <!-- ==================== 事件详情 / 编辑 ==================== -->
  <div id="event-modal" class="modal-overlay hidden">
    <div id="modal-details" class="modal-box">
      <h3>Details</h3>
      <div id="modal-view">
        <div id="view-title" class="view-title"></div>
        <div id="view-time" class="view-time"></div>
        <div id="view-location" class="view-location"></div>
        <div id="view-note" class="view-note"></div>
      </div>
      <div class="modal-actions">
        <button id="modal-delete">删除</button>
        <button id="modal-edit-btn">修改</button>
        <button id="modal-close">关闭</button>
      </div>
    </div>

    <div id="modal-alter" class="modal-box hidden">
      <h3>Alter</h3>
      <div id="modal-edit">
        <label>标题<input id="edit-title" type="text"></label>
        <label>开始时间<input id="edit-start" type="text" placeholder="YYYY-MM-DD HH:MM"></label>
        <label>结束时间<input id="edit-end" type="text" placeholder="YYYY-MM-DD HH:MM"></label>
        <label>地点<input id="edit-location" type="text"></label>
        <label>备注<textarea id="edit-note" rows="3"></textarea></label>
      </div>
      <div class="modal-actions">
        <button id="modal-save">保存</button>
        <button id="modal-cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- ==================== API Key 设置 ==================== -->
  <div id="credentials-modal" class="modal-overlay hidden">
    <div class="modal-box wide">
      <h3>API Key 与邮箱设置</h3>
      <p class="modal-note">
        这些内容会<strong>加密后保存在你自己的账号下</strong>，只有你能取用 ——
        即使数据库被拖走，别人拿到的也只是密文。留空表示不修改已保存的值。
      </p>

      <div class="form-grid">
        <label>DeepSeek API Key
          <input id="cred-key" type="password" autocomplete="off" spellcheck="false">
          <small>用于 AI 对话。在 platform.deepseek.com 创建。</small>
        </label>
        <label>QQ 邮箱（可选）
          <input id="cred-user" type="text" autocomplete="off" spellcheck="false">
          <small>用于把日历以附件发到邮箱。</small>
        </label>
        <label>QQ 邮箱授权码（可选）
          <input id="cred-pass" type="password" autocomplete="off" spellcheck="false">
          <small>注意：是 16 位授权码，不是你登录 QQ 邮箱的密码。</small>
        </label>
      </div>

      <div id="cred-state" class="cred-state"></div>

      <div class="modal-actions">
        <button id="cred-clear" class="danger">清空已保存的</button>
        <button id="cred-save" class="primary">保存</button>
        <button id="cred-close">关闭</button>
      </div>
    </div>
  </div>

  <!-- ==================== 我的记忆 ==================== -->
  <div id="memory-modal" class="modal-overlay hidden">
    <div class="modal-box wide">
      <h3>我的记忆</h3>
      <p class="modal-note">
        这些是 AI 记住的关于你的信息。它每次对话都会读到，
        所以<strong>记错了就在这里直接删掉</strong>。
      </p>
      <div id="memory-body" class="memory-body"></div>
      <div class="modal-actions">
        <button id="memory-close">关闭</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/static/api.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/ui.js"></script>
  <script src="/static/session.js"></script>
</body>
</html>
