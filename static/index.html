<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover：让 env(safe-area-inset-*) 在 iPhone 上真正生效，
       输入框和底部栏才不会躲到 Safari 工具栏 / Home 指示条底下 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0e">
  <title>The King&rsquo;s Hand · 智能日程助手</title>
  <!-- favicon：先看 ICO（兼容性最好），支持 SVG 的浏览器会用矢量那份 -->
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/style.css">
  <!-- 主题层：只负责外观（深色 / 薰衣草紫），必须放在 style.css 之后 -->
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>

  <!-- ==================== 登录（手机号白名单） ==================== -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1>The King&rsquo;s Hand</h1>
      <p class="login-sub">自然语言排日程 · 查天气 · 避冲突</p>

      <form id="login-form" autocomplete="on">
        <label>手机号
          <input id="login-phone" type="tel" inputmode="numeric" maxlength="11"
                 autocomplete="tel" placeholder="11 位手机号">
        </label>

        <!-- 这两段默认藏着：后端返回 need_password / need_setup 时才展开，
             避免普通成员看到一堆用不上的框 -->
        <label id="login-password-field" class="hidden">管理员密码
          <input id="login-password" type="password" autocomplete="current-password"
                 placeholder="请输入管理员密码">
        </label>
        <div id="login-new-password-field" class="hidden">
          <label>设置密码
            <input id="login-new-password" type="password" autocomplete="new-password"
                   placeholder="至少 6 位">
          </label>
          <label>确认密码
            <input id="login-new-password2" type="password" autocomplete="new-password"
                   placeholder="再输入一次">
          </label>
        </div>

        <div id="login-error" class="login-error hidden"></div>
        <button id="login-submit" type="submit" class="primary">进入</button>
      </form>

      <p id="login-hint" class="login-hint">只有名单内的手机号可以进入。</p>
    </div>
  </div>

  <!-- ==================== 主界面 ====================
       桌面：左右两栏（聊天 / 周历）横向排列
       手机：整体变成 200% 宽的滑动轨道，左右滑动切换两屏 -->
  <div id="app-root" class="app-container hidden">

    <!-- 手机端顶部导航：标题 + 对话/日程分段 + 设置。桌面端隐藏 -->
    <div class="mobile-nav">
      <span class="mobile-title">The King&rsquo;s Hand</span>
      <div class="mobile-seg" role="tablist" aria-label="切换视图">
        <span class="seg-glider" id="seg-glider" aria-hidden="true"></span>
        <button class="seg-btn active" type="button" data-screen="0" role="tab">对话</button>
        <button class="seg-btn" type="button" data-screen="1" role="tab">日程</button>
      </div>
      <button class="icon-btn js-open-settings" type="button" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>

    <!-- ---------- 滑动轨道：桌面并排 / 手机左右各一屏 ---------- -->
    <div id="screens" class="screens">

    <!-- ---------- 第一屏：对话 + 任务 ---------- -->
    <div class="left-panel" data-screen="0">
      <div class="chat-container">
        <div class="chat-header">
          <h2>The King&rsquo;s Hand</h2>
          <button class="icon-btn js-open-settings" type="button" title="设置" aria-label="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
        <div id="chat-history" class="chat-history"></div>
        <div class="chat-input-area">
          <input id="chat-input" type="text" placeholder="输入任务，例如：明天下午三点开会" autocomplete="off">
          <button id="send-btn">发送</button>
        </div>
      </div>

      <div class="task-container">
        <div class="task-tabs">
          <span class="tab-glider" id="tab-glider" aria-hidden="true"></span>
          <button class="tab-btn active" data-tab="confirmed">To be confirmed</button>
          <button class="tab-btn" data-tab="planned">To be planned</button>
          <button id="confirm-all-btn" class="btn-confirm">全部确认</button>
        </div>
        <div id="task-list" class="task-list"></div>
      </div>
    </div>

    <!-- ---------- 第二屏：周历 ---------- -->
    <div class="right-panel" data-screen="1">
      <div id="main-calendar" class="main-calendar">
        <div class="calendar-header">
          <div class="calendar-header-top">
            <div>
              <div class="calendar-title">Week View</div>
              <div class="calendar-range" id="calendar-range"></div>
            </div>
          </div>
          <div class="calendar-days"></div>
        </div>
        <div class="calendar-body" id="calendar-body"></div>
      </div>

      <div id="bottom-handle" class="bottom-handle">
        <span>⌃ Next Week</span>
      </div>

      <div id="next-week-overlay" class="next-week-overlay hidden">
        <div class="overlay-header">
          <span id="overlay-title">Next Week</span>
          <button id="overlay-close">收起</button>
        </div>
        <div class="overlay-days-header" id="overlay-days-header"></div>
        <div class="overlay-body" id="overlay-body"></div>
      </div>
    </div>

    </div><!-- /#screens -->
  </div>

  <!-- ==================== 事件详情 / 编辑 ==================== -->
  <div id="event-modal" class="modal-overlay hidden">
    <div id="modal-details" class="modal-box">
      <h3>Details</h3>
      <div id="modal-view">
        <div id="view-title" class="view-title"></div>
        <div id="view-time" class="view-time"></div>
        <div id="view-location" class="view-location"></div>
        <div id="view-note" class="view-note"></div>
      </div>
      <div class="modal-actions">
        <button id="modal-delete">删除</button>
        <button id="modal-edit-btn">修改</button>
        <button id="modal-close">关闭</button>
      </div>
    </div>

    <div id="modal-alter" class="modal-box hidden">
      <h3>Alter</h3>
      <div id="modal-edit">
        <label>标题<input id="edit-title" type="text"></label>
        <label>开始时间<input id="edit-start" type="text" placeholder="YYYY-MM-DD HH:MM"></label>
        <label>结束时间<input id="edit-end" type="text" placeholder="YYYY-MM-DD HH:MM"></label>
        <label>地点<input id="edit-location" type="text"></label>
        <label>备注<textarea id="edit-note" rows="3"></textarea></label>
      </div>
      <div class="modal-actions">
        <button id="modal-save">保存</button>
        <button id="modal-cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- ==================== 设置（原来散在头部的 6 个入口都收在这里） ==================== -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-box settings-box">
      <div class="settings-head">
        <div class="settings-avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="settings-who">
          <div id="user-chip" class="settings-name">…</div>
          <div id="settings-role" class="settings-role">已登录</div>
        </div>
        <button id="settings-close" class="icon-btn" type="button" aria-label="关闭设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <div class="settings-group">
        <div class="settings-label">对话</div>
        <div class="settings-row static">
          <div class="sr-text">
            <div class="sr-title">思考过程</div>
            <div class="sr-sub">显示 AI 的推理步骤与工具调用</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="show-steps" checked>
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-label">数据</div>
        <button class="settings-row" type="button" id="memory-btn">
          <div class="sr-text">
            <div class="sr-title">我的记忆</div>
            <div class="sr-sub">查看和修改 AI 记住的信息</div>
          </div>
          <span class="sr-chev" aria-hidden="true">›</span>
        </button>
        <button class="settings-row" type="button" id="export-ics-btn">
          <div class="sr-text">
            <div class="sr-title">下载 .ics</div>
            <div class="sr-sub">导出到系统日历</div>
          </div>
          <span class="sr-chev" aria-hidden="true">›</span>
        </button>
        <button class="settings-row" type="button" id="reset-btn">
          <div class="sr-text">
            <div class="sr-title">清空对话</div>
            <div class="sr-sub">只清上下文，不动日历和记忆</div>
          </div>
          <span class="sr-chev" aria-hidden="true">›</span>
        </button>
      </div>

      <div class="settings-group">
        <div class="settings-label">账户</div>
        <button class="settings-row hidden" type="button" id="admin-btn">
          <div class="sr-text">
            <div class="sr-title">访问管理</div>
            <div class="sr-sub">名单、全站 API Key、登录密码</div>
          </div>
          <span class="sr-chev" aria-hidden="true">›</span>
        </button>
        <button class="settings-row hidden" type="button" id="settings-btn">
          <div class="sr-text">
            <div class="sr-title">API Key 设置</div>
            <div class="sr-sub">DeepSeek 密钥，全员共用</div>
          </div>
          <span class="sr-chev" aria-hidden="true">›</span>
        </button>
        <button class="settings-row danger" type="button" id="logout-btn">
          <div class="sr-text">
            <div class="sr-title">退出登录</div>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 我的记忆 ==================== -->
  <div id="memory-modal" class="modal-overlay hidden">
    <div class="modal-box wide">
      <h3>我的记忆</h3>
      <p class="modal-note">
        这些是 AI 记住的关于你的信息，每次对话都会读到。
        <strong>记错了就在这里直接删掉。</strong>
      </p>
      <div id="memory-body" class="memory-body"></div>
      <div class="modal-actions">
        <button id="memory-close">关闭</button>
      </div>
    </div>
  </div>

  <!-- ==================== 访问管理（仅管理员） ==================== -->
  <div id="admin-modal" class="modal-overlay hidden">
    <div class="modal-box wide">
      <h3>访问管理</h3>
      <p class="modal-note">
        只有名单里的手机号能登录。<strong>第一个成功登录的手机号会自动成为管理员，
        并当场设置密码。</strong>之后管理员每次登录都要输密码。
      </p>

      <!-- 全站 DeepSeek Key：所有成员共用这一把，普通成员不需要自己填 -->
      <div class="form-grid">
        <label>全站 DeepSeek API Key（所有成员共用）
          <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
            <input id="admin-api-key" type="password" autocomplete="off" spellcheck="false"
                   placeholder="sk-…" style="flex:1 1 220px; min-width:0;">
            <button id="admin-api-key-save" class="primary" style="white-space:nowrap;">保存</button>
            <button id="admin-api-key-clear" style="white-space:nowrap;">清空</button>
          </div>
          <div id="admin-api-key-state" class="cred-state"></div>
        </label>
      </div>

      <!-- 高德 Key：只用于查实时路况，可选；不配就不启用路况功能 -->
      <div class="form-grid">
        <label>高德 Web 服务 Key（用于查路况，可选）
          <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
            <input id="admin-amap-key" type="password" autocomplete="off" spellcheck="false"
                   placeholder="32 位高德 Key" style="flex:1 1 220px; min-width:0;">
            <button id="admin-amap-save" class="primary" style="white-space:nowrap;">保存</button>
            <button id="admin-amap-clear" style="white-space:nowrap;">清空</button>
          </div>
          <div id="admin-amap-state" class="cred-state"></div>
          <span class="hint">在高德控制台创建 Key 时，服务平台必须选「Web服务」。</span>
        </label>
      </div>

      <div class="form-grid">
        <label>修改我的登录密码
          <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
            <input id="admin-old-pwd" type="password" autocomplete="current-password"
                   placeholder="当前密码" style="max-width:150px;">
            <input id="admin-new-pwd" type="password" autocomplete="new-password"
                   placeholder="新密码（至少 6 位）" style="max-width:190px;">
            <button id="admin-pwd-save" style="white-space:nowrap;">修改密码</button>
          </div>
        </label>
      </div>

      <div class="form-grid">
        <label>添加手机号
          <div style="display:flex; gap:6px; align-items:center;">
            <input id="admin-phone" type="tel" inputmode="numeric" maxlength="11" placeholder="11 位手机号">
            <input id="admin-name" type="text" placeholder="备注名（可选）" style="max-width:140px;">
            <button id="admin-add" class="primary" style="white-space:nowrap;">添加</button>
          </div>
        </label>
      </div>

      <div id="admin-list" class="memory-body"></div>
      <div class="modal-actions">
        <button id="admin-close">关闭</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/static/api.js"></script>
  <script src="/static/store.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/session.js"></script>
</body>
</html>
